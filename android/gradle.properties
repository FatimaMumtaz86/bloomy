org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx1024m
org.gradle.workers.max=2
android.useAndroidX=true

# Work around Kotlin daemon incremental cache crashes on Windows when
# project and pub cache are on different drive roots.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.compiler.execution.strategy=in-process

# Reduce stale build-cache interactions for plugin subprojects.
org.gradle.caching=false
