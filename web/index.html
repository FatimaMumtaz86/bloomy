  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFF7FB;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    .bloomy-quick-links {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 300px;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .bloomy-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(45, 30, 55, 0.18);
      backdrop-filter: blur(3px);
    }

    .bloomy-chip-primary {
      background: #e46c95;
      color: #ffffff;
    }

    .bloomy-chip-secondary {
      background: #ffffff;
      color: #4b3a5b;
      border: 1px solid #e9d7e2;
    }

    .bloomy-trust {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #ead8e5;
      border-radius: 14px;
      padding: 10px 12px;
      color: #5b4a69;
      font-size: 11px;
      line-height: 1.4;
      box-shadow: 0 6px 18px rgba(45, 30, 55, 0.12);
    }

    .bloomy-trust strong {
      color: #3c2f47;
    }

    @media (max-width: 640px) {
      .bloomy-quick-links {
        right: 10px;
        left: 10px;
        bottom: 10px;
        max-width: none;
      }

      .bloomy-chip {
        width: 100%;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
