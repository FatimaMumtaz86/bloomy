<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="bloomy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>bloomy</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFF7FB;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    .bloomy-entry-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 20% 15%, rgba(228, 108, 149, 0.2), transparent 46%),
        radial-gradient(circle at 85% 12%, rgba(136, 104, 186, 0.18), transparent 44%),
        rgba(35, 24, 41, 0.58);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .bloomy-entry-overlay.visible {
      display: flex;
    }

    .bloomy-entry-card {
      width: min(520px, 100%);
      border-radius: 24px;
      background: #fff9fd;
      border: 1px solid #efdeea;
      box-shadow: 0 22px 52px rgba(39, 25, 46, 0.36);
      padding: 22px;
      color: #3f2d49;
    }

    .bloomy-entry-badge {
      display: inline-block;
      border-radius: 999px;
      background: #f7d9e6;
      color: #7a3c5e;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 10px;
      margin-bottom: 10px;
    }

    .bloomy-entry-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      color: #2f2138;
    }

    .bloomy-entry-subtitle {
      margin: 10px 0 18px;
      color: #6a5874;
      font-size: 14px;
      line-height: 1.5;
    }

    .bloomy-entry-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bloomy-entry-btn {
      border: 0;
      border-radius: 14px;
      min-height: 46px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .bloomy-entry-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(30, 21, 35, 0.18);
    }

    .bloomy-entry-btn-android {
      background: linear-gradient(135deg, #df5f8d, #be4f9b);
      color: #ffffff;
    }

    .bloomy-entry-btn-web {
      background: #ffffff;
      color: #513e5e;
      border: 1px solid #dfccda;
    }

    .bloomy-entry-ios {
      border-radius: 14px;
      background: #f4edf3;
      border: 1px dashed #dac6d8;
      color: #6b5877;
      padding: 10px 12px;
      font-size: 13px;
      text-align: center;
    }

    .bloomy-entry-footer {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      color: #6d5a79;
      font-size: 12px;
    }

    .bloomy-entry-footer a {
      color: #7b3f63;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .bloomy-entry-card {
        padding: 18px;
        border-radius: 18px;
      }

      .bloomy-entry-title {
        font-size: 24px;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="bloomy-entry-overlay" class="bloomy-entry-overlay">
    <div class="bloomy-entry-card" role="dialog" aria-modal="true" aria-labelledby="bloomy-entry-title">
      <div class="bloomy-entry-badge">Start Here</div>
      <h1 id="bloomy-entry-title" class="bloomy-entry-title">Choose your Bloomy path</h1>
      <p class="bloomy-entry-subtitle">
        Android users can install the app. If you are not on Android, continue directly on web.
      </p>

      <div class="bloomy-entry-actions">
        <a
          class="bloomy-entry-btn bloomy-entry-btn-android"
          href="https://github.com/FatimaMumtaz86/bloomy/releases/latest/download/app-release.apk"
          target="_blank"
          rel="noopener noreferrer"
        >
          Download Android APK
        </a>

        <button id="bloomy-continue-web" type="button" class="bloomy-entry-btn bloomy-entry-btn-web">
          Not an Android user? Continue on web
        </button>

        <div class="bloomy-entry-ios">It will bloom soon on iPhone iOS.</div>
      </div>

      <div class="bloomy-entry-footer">
        <span>Version 1.0.0+1</span>
        <a href="privacy-policy.html">Privacy Policy</a>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var entryKey = 'bloomy_web_entry_choice';
      var overlay = document.getElementById('bloomy-entry-overlay');
      var continueBtn = document.getElementById('bloomy-continue-web');

      if (!overlay || !continueBtn) {
        return;
      }

      try {
        if (window.localStorage.getItem(entryKey) === 'web') {
          return;
        }
      } catch (_) {}

      overlay.classList.add('visible');

      continueBtn.addEventListener('click', function () {
        try {
          window.localStorage.setItem(entryKey, 'web');
        } catch (_) {}
        overlay.classList.remove('visible');
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
